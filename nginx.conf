server {
  listen 80;
  server_name _;

  # Serve static files from /usr/share/nginx/html (copied from dist)
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location / {
    # Try file, else fallback to index.html for SPA routing
    try_files $uri $uri/ /index.html;
  }

  # Optional: cache immutable assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
